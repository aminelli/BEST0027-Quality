<html>

    <head>

        <script>
            function verificaPassword() { 
                var password = document.getElementById("txtPassword").value; 
                var confermaPassword = document.getElementById("txtConferma_Password").value; 
                if (password !== confermaPassword) 
                    { 
                        alert("Le password non corrispondono!"); 
                        return false; 
                    } 
                else window.location.href = "register_success.html"; 
            }


        </script>

    </head>

    <body>
        
        <h1>Welcome to the User Registration Page</h1>
        <p>Please <a href="index.html">home</a> to continue.</p>
        <p>Please <a href="about.html">about</a> to continue.</p>
        <p>Please <a href="login.html">login</a> to continue.</p>

        <br>

        <br>
        <input id="txtCognome" type="text" style="width: 200px;">

        <br><br>

        <br>
        <input id="txtData_Nascita" type="date" style="width: 200px;">

        <br><br>

        <input id="txtEmail" type="email" style="width: 200px;">

        <br><br>

</html>
