version: '3.8'

services:
  angular-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: angular-app
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - angular-network

  # Opzionale: Servizio per sviluppo con hot-reload
  angular-dev:
    image: node:20.11.0-alpine
    container_name: angular-dev
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    command: sh -c "npm install && npm start -- --host 0.0.0.0"
    environment:
      - NODE_ENV=development
    networks:
      - angular-network
    profiles:
      - dev

networks:
  angular-network:
    driver: bridge